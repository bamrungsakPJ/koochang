#service-ux-flows .followup{background:linear-gradient(130deg,var(--s-warnbg),var(--s-panel));border:1px solid light-dark(#f1deb5,#665034);box-shadow:none}

#service-ux-flows .team-request .avatar{background:var(--s-soft);border-radius:13px}

@media(max-width:420px){#service-ux-flows .head{margin:0 -16px 20px;padding:17px 16px 21px}#service-ux-flows .hero{padding:19px 16px}#service-ux-flows .hero-time{font-size:25px}#service-ux-flows .hero-equipment{width:66px;height:66px}#service-ux-flows .hero h2{font-size:23px}#service-ux-flows .time{font-size:13px;min-width:45px;padding:9px 4px}#service-ux-flows .job{gap:9px}}

#service-ux-flows .toast{border-left:3px solid var(--s-lime)}

function home(design){
const owner=state.role==='owner';
const header=`<div class="head"><div><div class="brandline"><span class="brandstamp">${icon('wrench')}</span> ABC AIR <span class="sub">ทีมบริการ</span></div><h1>${owner?'วันนี้ที่ร้าน':'สวัสดี ช่างเอก'}</h1><div class="dayline">${icon('calendar-days')} ศุกร์ 2 ตุลาคม 2569</div></div><button class="icon-btn cursor-interaction" aria-label="การแจ้งเตือน" data-action="notifications">${icon('bell')}</button></div>`;
if(owner)return header+`<div class="stat-line"><div><div class="count">4</div><div class="sub">งานวันนี้</div></div><div><div class="count">1</div><div class="sub">รอมอบหมาย</div></div><div><div class="count">2</div><div class="sub">เสร็จแล้ว</div></div></div>${btn(icon('plus')+' สร้างงาน','create')}<div class="section-label"><h3>ต้องติดตามวันนี้</h3></div><button class="panel job followup cursor-interaction" data-action="maintenance"><span class="avatar">${icon('calendar-clock')}</span><span class="job-body"><h3>ถึงรอบดูแล 8 เครื่อง</h3><div class="sub">3 เครื่องเกินกำหนด · แตะเพื่อนัดหมาย</div></span>${icon('chevron-right')}</button><button class="panel job team-request cursor-interaction" data-action="team"><span class="avatar">${icon('user-round-plus')}</span><span class="job-body"><h3>${state.approved?'ทีมช่างพร้อมใช้งาน':'ช่างบอลขอเข้าร่วมทีม'}</h3><div class="sub">${state.approved?'ช่างบอล · อนุมัติแล้ว':'รอคุณอนุมัติ 1 คน'}</div></span>${icon('chevron-right')}</button><div class="section-label"><h3>งานวันนี้</h3>${btn('ดูทั้งหมด','jobs','link')}</div>${job('10:00','คุณสมชาย','ล้างแอร์ · 3 เครื่อง',state.done?'เสร็จแล้ว':'ช่างเอก')}${job('14:00','บริษัท ABC','ตรวจเช็ก · 2 เครื่อง','ช่างบอล')}`;
if(design==='focus')return header+`<div class="hero"><div class="row"><span class="hero-label">${state.done?'งานเสร็จแล้ว':'งานถัดไปของคุณ'}</span><span class="hero-time">10:00</span></div><div class="hero-body"><div><h2>คุณสมชาย</h2><p>ล้างแอร์ 3 เครื่อง</p><div class="sub">บ้าน · บางบัวทอง</div></div><div class="hero-equipment">${appliance()}</div></div>${btn((state.done?'ดูงานที่เสร็จ':'เปิดรายละเอียดงาน')+' '+icon('arrow-right'),'job')}</div><div class="action-row">${btn(icon('map-pin')+' สถานที่','job','secondary')}${btn(icon('phone')+' โทรหาลูกค้า','call','secondary')}</div><div class="section-label"><h3>ถัดจากนี้</h3><span>อีก 2 งาน</span></div>${job('13:00','คุณอารีย์','ซ่อม · แอร์ไม่เย็น')}${job('15:30','คุณวิชัย','ตรวจเช็ก · 1 เครื่อง')}<div class="footer-action">${btn(icon('plus')+' บันทึกงานหน้างาน','adhoc','secondary')}</div>`;
return header+`<div class="row"><h3>งานของคุณวันนี้</h3><span class="tag">3 งาน</span></div><div class="chips">${chip('ทั้งหมด','filter-all',state.filter==='ทั้งหมด')}${chip('ยังไม่เสร็จ','filter-open',state.filter!=='ทั้งหมด')}</div>${!state.done||state.filter==='ทั้งหมด'?job('10:00','คุณสมชาย','ล้างแอร์ · 3 เครื่อง',state.done?'เสร็จแล้ว':state.started?'กำลังทำ':'นัดแล้ว'):''}${job('13:00','คุณอารีย์','ซ่อม · แอร์ไม่เย็น')}${job('15:30','คุณวิชัย','ตรวจเช็ก · 1 เครื่อง')}<div class="note">${icon('clipboard-list')} เปิดงานเพื่อดูอุปกรณ์ ประวัติ และสถานที่</div><div class="footer-action">${btn(icon('plus')+' บันทึกงานหน้างาน','adhoc','secondary')}</div>`;

function screen(design){

switch(state.screen){
case 'welcome':return `<div class="welcome-brand"><span class="avatar">${icon('wrench')}</span><span>ระบบงานบริการ</span></div><div class="hero" style="margin-top:28px"><div class="hero-label">เริ่มต้นใช้งาน</div><div class="hero-body"><div><h2>งานวันนี้<br>ต่อยอดบริการ<br>ครั้งถัดไป</h2></div><div class="hero-equipment">${appliance()}</div></div></div><h2 style="margin-top:24px">คุณใช้งานในบทบาทไหน</h2><p class="sub">เริ่มจากงานแรกได้เลย ไม่ต้องเตรียมข้อมูลครบ</p><div class="footer-action">${btn('ฉันเป็นเจ้าของร้าน','register')}<p class="sub" style="text-align:center;margin:8px 0 22px">สร้างร้าน จัดทีม และมอบหมายงาน</p>${btn('ฉันเป็นช่าง · มีลิงก์ของร้าน','join','secondary')}<p class="sub" style="text-align:center;margin:8px 0 22px">เปิดลิงก์ร้าน ใส่ชื่อ แล้วขอเข้าร่วม</p></div>${btn('ดูร้านตัวอย่าง','demo-home','link')}`;
case 'register':return back('welcome')+`<p class="sub">สำหรับเจ้าของร้าน</p><h1>สร้างร้านของคุณ</h1><p class="sub">เริ่มด้วยชื่อร้านและเบอร์ที่ติดต่อได้</p>${steps(1,2)}<label class="field">ชื่อร้าน<input data-field="shopName" value="${esc(state.shopName)}" placeholder="เช่น ABC AIR" autocomplete="organization" required></label><label class="field">เบอร์โทรเจ้าของร้าน<input data-field="ownerPhone" value="${esc(state.ownerPhone)}" inputmode="tel" autocomplete="tel" required></label><div class="note">${icon('shield-check')} เบอร์นี้ใช้ยืนยันตัวตนและกลับเข้าใช้งานร้าน</div><div class="footer-action">${btn('ต่อไป · ยืนยันเบอร์โทร','verify-owner')}</div>`;

case 'join-invalid':return `<div class="success"><div class="success-mark">${icon('link-2-off')}</div><h1>ลิงก์นี้ใช้งานไม่ได้</h1><p class="sub">ร้านอาจปิดรับเข้าร่วมหรือเปลี่ยนลิงก์แล้ว</p></div><p>ขอลิงก์ล่าสุดจากเจ้าของร้านแล้วลองอีกครั้ง</p><div class="footer-action">${btn('กลับหน้าเริ่มต้น','welcome','secondary')}</div>`;

case 'sync-conflict':return back('offline-draft')+`<h1>งานเปลี่ยนระหว่างออฟไลน์</h1><p class="sub">เจ้าของร้านยกเลิกนัดขณะที่คุณบันทึกบริการ</p><div class="panel" style="margin-top:20px"><h3>ข้อมูลที่คุณบันทึกยังเก็บอยู่</h3><p class="sub">ระบบยังไม่เขียนทับสถานะล่าสุดของร้าน</p></div><div class="note warn">${icon('triangle-alert')} ตรวจสอบกับเจ้าของร้านก่อนส่งบริการจริง</div>${btn('ดูสถานะล่าสุด','job-cancelled','secondary')}`;
case 'gps-denied':return back('job')+`<h1>ยังบันทึกพิกัดไม่ได้</h1><p class="sub">ไม่ได้รับสิทธิ์ตำแหน่งในขณะนี้</p><div class="panel" style="margin-top:18px"><h3>บ้านคุณสมชาย</h3><p class="sub">หมู่บ้านตัวอย่าง บางบัวทอง</p></div><p>ใช้ที่อยู่ไปก่อนและทำบริการต่อได้</p><div class="footer-action">${btn('กลับไปทำงาน','record')}</div>${btn('ลองบันทึกพิกัดอีกครั้ง','gps-retry','link')}`;
case 'maintenance-booked':return back('maintenance')+`<span class="tag">มีนัดแล้ว</span><h1 style="margin-top:18px">แอร์ห้องนอน</h1><p class="sub">คุณสมชาย · บ้าน</p><div class="panel" style="margin-top:20px"><h3>ล้าง / บำรุงรักษา</h3><p>3 ตุลาคม 2569 · 10:00</p><p class="sub">ช่างบอล · ยังไม่ได้บริการจริง</p></div><div class="note">${icon('calendar-check')} ไม่ต้องสร้างนัดซ้ำ รอบใหม่จะเริ่มเมื่อบริการเสร็จ</div>${btn('ดูนัดหมาย','job')}`;

default:return home(design);

function render(){
root.querySelectorAll('[data-role]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.role===state.role)));
root.querySelectorAll('.service-phone').forEach(phone=>{
phone.style.setProperty('--s-radius',models[phone.dataset.design].radius+'px');
phone.querySelector('.phone-content').setAttribute('aria-live','polite');
phone.querySelector('.phone-content').innerHTML=screen(phone.dataset.design)+(state.toast?`<div class="toast" role="status">${state.toast}</div>`:'');
const gated=['access-suspended','join-invalid','welcome','register','owner-otp','org-ready','join','join-wait','join-ready'].includes(state.screen);
phone.querySelector('.phone-nav').hidden=gated;
phone.classList.toggle('onboarding',gated);
const tabs=state.role==='owner'?[['home','house','หน้าแรก'],['jobs','clipboard-list','งาน'],['search','users','ลูกค้า'],['more','menu','เพิ่มเติม']]:[['home','house','วันนี้'],['jobs','clipboard-list','งาน'],['search','search','ค้นหา'],['more','menu','เพิ่มเติม']];
phone.querySelector('.phone-nav').innerHTML=tabs.map(([a,i,t])=>`<button type="button" class="cursor-interaction ${state.screen===a?'active':''}" data-action="${a}" ${state.screen===a?'aria-current="page"':''}>${icon(i)}${t}</button>`).join('');
});
root.querySelector('.approval-simulator').hidden=state.screen!=='join-wait';
if(globalThis.lucide)lucide.createIcons({attrs:{width:16,height:16}});
}
root.addEventListener('click',e=>{
const role=e.target.closest('[data-role]');if(role){state.role=role.dataset.role;state.screen=state.role==='tech'&&state.joinPending&&!state.approved?'join-wait':'home';state.toast='';render();persist();return;}
const b=e.target.closest('[data-action]');if(!b)return;const a=b.dataset.action;state.toast='';
if(a==='register'){state.role='owner';state.screen='register';}
else if(a==='join'){state.role='tech';state.screen='join';}
else if(a==='demo-home'){state.screen='home';}
else if(a==='demo-create'){state.role='owner';state.screen='create';state.lookupDone=false;}
else if(a==='verify-owner'){if(!state.shopName.trim()||!/^\d{9,12}$/.test(state.ownerPhone.replace(/\D/g,'')))state.toast='กรอกชื่อร้านและเบอร์โทรที่ติดต่อได้';else state.screen='owner-otp';}
else if(a==='create-org'){if(state.otp!=='123456')state.toast='ใช้รหัสตัวอย่าง 123456 เพื่อทดลอง';else state.screen='org-ready';}
else if(a==='resend'){state.toast='ต้นแบบไม่ส่ง SMS · ใช้รหัสตัวอย่าง 123456';}
else if(a==='request-join'){if(!state.joinName.trim())state.toast='ใส่ชื่อที่ใช้ในร้านก่อน';else{state.joinPending=true;state.approved=false;state.screen='join-wait';}}
else if(a==='check-join'){if(state.approved)state.screen='join-ready';else state.toast='ยังรอเจ้าของร้านอนุมัติ';}
else if(a==='simulate-approve'){state.approved=true;state.screen='join-ready';}
else if(a==='tech-ready'){state.role='tech';state.joinPending=false;state.screen='home';}
else if(a==='lookup-customer'){if(!state.customerQuery.trim())state.toast='กรอกเบอร์โทรเพื่อค้นหา';else state.lookupDone=true;}
else if(a==='use-existing'){state.customerName='คุณสมชาย';state.customerPhone='0812345678';state.newCustomer=false;state.screen='location-pick';}
else if(a==='customer-new'){state.newCustomer=true;state.customerName='';state.customerPhone=state.customerQuery||'';state.screen='customer-new';}
else if(a==='save-customer'){if(!state.customerName.trim()||!/^\d{9,12}$/.test(state.customerPhone.replace(/\D/g,'')))state.toast='กรอกชื่อและเบอร์ลูกค้าที่ติดต่อได้';else{state.locationName='บ้าน';state.address='';state.locationHasGps=false;state.screen='location-new';}}
else if(a==='use-home'){state.locationName='บ้าน';state.address='หมู่บ้านตัวอย่าง บางบัวทอง';state.locationHasGps=true;state.screen='job-info';}
else if(a==='use-shop'){state.locationName='ร้าน';state.address='บางใหญ่';state.locationHasGps=false;state.screen='job-info';}
else if(a==='save-location'){if(!state.locationName.trim())state.toast='ใส่ชื่อสถานที่ก่อน';else{state.locationHasGps=false;state.screen='job-info';}}
else if(a==='review-new'){if(!state.date||!state.time)state.toast='เลือกวันและเวลานัดก่อน';else state.screen='review-new';}
else if(a==='book-new'){state.screen='new-job-success';}
else if(a==='call-new'){state.toast='จำลองโทร '+state.customerPhone+' · ไม่มีการโทรจริง';}
else if(a==='navigate-new'){state.toast=state.locationHasGps?'จำลองใช้พิกัดสถานที่เดิม':'ยังไม่มีพิกัด · เปิดค้นหาจากที่อยู่ได้';}
else if(a.startsWith('interval-'))state.interval=a.slice(9);
else if(a==='start'){state.started=true;state.screen='record';}
else if(a==='gps'){state.gps=true;state.toast='จำลองบันทึกพิกัดสถานที่แล้ว · ต้นแบบไม่ได้ขอตำแหน่งจริง';}
else if(a==='before'||a==='after'){state[a]=true;state.toast='เพิ่มภาพตัวอย่างแล้ว · ต้นแบบไม่เปิดกล้องจริง';}
else if(a==='ocr')state.ocr=true;
else if(a==='added'){state.screen='record';state.toast='เพิ่มแอร์ห้องครัวแล้ว · ใช้ลูกค้าและสถานที่เดิม';}
else if(a==='complete'){state.done=true;state.booked=false;state.screen='success';}
else if(a==='book'){state.booked=true;state.screen='success';}
else if(a==='approve'){state.approved=true;state.toast='อนุมัติช่างบอลแล้ว';}
else if(a==='reject')state.toast='จำลองปฏิเสธคำขอแล้ว';
else if(a==='call')state.toast='จำลองโทร 081-234-5678 · ไม่มีการโทรจริง';
else if(a==='navigate')state.toast=state.gps?'จำลองเปิดแผนที่ด้วยพิกัดสถานที่เดิม':'ยังไม่มีพิกัด · ใช้ที่อยู่เพื่อเปิดค้นหาในแผนที่';
else if(a==='copy'){state.toast='ลิงก์ตัวอย่างชุด '+state.linkVersion+' พร้อมแชร์ให้ช่างทุกคน';}
else if(a==='qr'){state.teamDialog='qr';}
else if(a==='close-team-dialog'){state.teamDialog='';}
else if(a==='toggle-join'){state.joinOpen=!state.joinOpen;}
else if(a==='reset-link'){state.teamDialog='reset';}
else if(a==='confirm-reset'){state.linkVersion++;state.teamDialog='';state.toast='ลิงก์เดิมใช้ส่งคำขอใหม่ไม่ได้แล้ว';} 
else if(a==='filter-all')state.filter='ทั้งหมด';
else if(a==='filter-open')state.filter='ยังไม่เสร็จ';
else if(a==='due-over')state.filter='เกินกำหนด';
else if(a==='due-seven')state.filter='7 วัน';
else if(a==='individual')state.screen='interval-individual';
else if(a==='pick')state.screen='equipment-pick';
else if(a==='scan'){state.toast='จำลองอ่าน SN 38291021 · พบแอร์ห้องนอนของคุณสมชาย';}
else if(a==='tomorrow')state.screen='empty-jobs';
else if(a==='today')state.screen='jobs';
else if(a==='shop')state.toast='ABC AIR · เขตเวลาไทย';
else if(a==='save-individual'){state.screen='interval';state.toast='บันทึกรอบแยกรายเครื่องแล้ว';}
else if(a==='photo-before'){state.photoType='before';}
else if(a==='photo-after'){state.photoType='after';}
else if(a==='accept-ocr'){state.screen='record';state.toast='ใช้ข้อมูลที่ตรวจสอบแล้ว เพิ่มเครื่องในสถานที่เดิม';}
else if(a==='save-reschedule'){state.screen='job';state.toast='เปลี่ยนนัดเป็น '+dateLabel()+' '+state.time+' · แจ้ง '+state.assignee;}
else if(a==='cancel-job'){if(!state.cancelReason.trim())state.toast='ระบุเหตุผลก่อนยกเลิก';else state.screen='job-cancelled';}
else if(a==='toggle-member'){state.memberStatus=state.memberStatus==='ระงับ'?'ใช้งาน':'ระงับ';}
else if(a==='remove-member'){state.memberStatus='นำออกแล้ว';state.screen='team-controls';state.toast='นำช่างออกแล้ว · ประวัติงานเดิมยังอยู่';}
else if(a==='retry-sync'){state.screen='success';state.toast='จำลองส่งข้อมูลสำเร็จแล้ว';}
else if(a==='gps-retry'){state.gps=true;state.screen='job';state.toast='จำลองบันทึกพิกัดสถานที่แล้ว';} 
else state.screen=a;
render();persist();
});
root.addEventListener('change',e=>{if(e.target.matches('[data-preview-screen]')&&e.target.value){state.screen=e.target.value;state.toast='';render();persist();return;}if(e.target.dataset.field){state[e.target.dataset.field]=e.target.value;}});
root.addEventListener('input',e=>{if(e.target.dataset.field){state[e.target.dataset.field]=e.target.value;}if(!e.target.matches('[data-search]'))return;const q=e.target.value.toLowerCase();const result=e.target.closest('.phone-content').querySelector('.search-results');const data=[['คุณสมชาย · แอร์ห้องนอน','Mitsubishi · MSY-GN13VF','SN 38291021 · 0812345678'],['คุณสมชาย · แอร์ห้องรับแขก','Daikin · FTKF18','SN A92X1821 · 0812345678'],['คุณอารีย์ · แอร์ห้องนอน','Carrier · 42TVDA','SN 92K1183 · 0891234567']];const found=data.filter(x=>x.join(' ').toLowerCase().includes(q));result.innerHTML=found.map(x=>equipment(...x)).join('')||'<div class="empty" role="status">ไม่พบข้อมูล · ลองเบอร์ รุ่น หรือ Serial</div>';if(globalThis.lucide)lucide.createIcons({attrs:{width:16,height:16}});});
window.addEventListener('openai:set_globals',e=>{const s=e.detail?.globals?.widgetState?.privateContent;if(s?.role){state.role=s.role==='owner'?'owner':'tech';state.screen='home';render();}});
render();
if(globalThis.Tweak){root.querySelectorAll('.service-phone').forEach(phone=>{const m=models[phone.dataset.design];const tweak=new Tweak({container:phone,onChange:()=>phone.style.setProperty('--s-radius',m.radius+'px')});tweak.addSlider(m,'radius',{label:'มุมการ์ด',min:8,max:24,unit:'px'});});}
})();
</script>
