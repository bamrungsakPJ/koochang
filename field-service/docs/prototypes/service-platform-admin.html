<div id="service-platform-design">
  <div class="preview-tools"><label>ลองหน้าจอ <select data-preview><option value="dashboard">ผู้ดูแลแพลตฟอร์ม</option><option value="owner-sub">สมาชิกของร้าน</option><option value="admin-login">เข้าสู่ระบบผู้ดูแล</option><option value="owner-expired">ร้านหมดอายุสมาชิก</option></select></label><span>ข้อมูลจำลอง • ราคาใช้ทดสอบเท่านั้น • ไม่เชื่อมระบบรับเงินจริง</span></div>

</div>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500&display=swap');
#service-platform-design{--p-bg:light-dark(#f7f8f3,#12221f);--p-surface:light-dark(#fff,#1c302b);--p-text:light-dark(#163b35,#ebfaf2);--p-muted:light-dark(#657b72,#afc6bb);--p-action:light-dark(#008570,#75e1bb);--p-on:light-dark(#fff,#092b21);--p-soft:light-dark(#e5f5eb,#254a39);--p-lime:light-dark(#dbf395,#d0ef8e);--p-warning:light-dark(#fff0d0,#49351d);--p-warntext:light-dark(#925a09,#ffd184);--p-line:light-dark(#e2eae3,#344e43);--p-danger:light-dark(#aa352e,#ffafa7);font-family:'Noto Sans Thai',sans-serif;color:var(--p-text);font-size:14px;line-height:1.55}
#service-platform-design [hidden]{display:none!important}#service-platform-design[data-owner="true"] .secure{display:none}
#service-platform-design *{box-sizing:border-box}#service-platform-design button,#service-platform-design input,#service-platform-design select,#service-platform-design textarea{font:inherit}#service-platform-design button{cursor:inherit}#service-platform-design .preview-tools{display:flex;gap:16px;align-items:center;flex-wrap:wrap;margin-bottom:14px;font-size:12px;color:var(--p-muted)}#service-platform-design select,#service-platform-design input,#service-platform-design textarea{background:var(--p-surface);color:var(--p-text);padding:10px 12px;border:1px solid var(--p-line);border-radius:10px;max-width:100%;width:100%}#service-platform-design .preview-tools select{width:auto}
#service-platform-design .platform-shell{display:grid;grid-template-columns:200px minmax(0,1fr);background:var(--p-bg);border-radius:20px;overflow:hidden;min-height:650px}#service-platform-design .sidebar{background:var(--p-surface);padding:22px 14px;border-right:1px solid var(--p-line);display:flex;flex-direction:column;gap:20px}#service-platform-design .brand{display:flex;align-items:center;gap:10px;padding:0 8px;font-weight:500}#service-platform-design small{font-size:12px;color:var(--p-muted)}#service-platform-design .sidebar nav{display:grid;gap:5px}#service-platform-design .nav-item{display:flex;gap:10px;align-items:center;text-align:left;border:0;border-radius:10px;padding:11px 12px;background:transparent;color:var(--p-muted)}#service-platform-design .nav-item.active{background:var(--p-soft);color:var(--p-action);font-weight:500}#service-platform-design .staff{display:flex;align-items:center;gap:10px;margin-top:auto;padding:12px 4px}#service-platform-design .avatar{display:grid;place-items:center;background:var(--p-soft);border-radius:12px;width:36px;height:36px;color:var(--p-action)}#service-platform-design .workspace{min-width:0}#service-platform-design header{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:20px 26px;border-bottom:1px solid var(--p-line);background:var(--p-surface)}#service-platform-design .secure{font-size:12px;color:var(--p-muted);display:flex;gap:7px;align-items:center}#service-platform-design main{padding:26px}#service-platform-design h1{font-size:24px;font-weight:500;margin:0 0 6px;line-height:1.3}#service-platform-design h2{font-size:16px;font-weight:500;margin:0 0 12px}#service-platform-design p{margin:0 0 16px;color:var(--p-muted)}#service-platform-design .title-row{display:flex;justify-content:space-between;gap:16px;align-items:start;margin-bottom:18px}#service-platform-design .panel{background:var(--p-surface);border-radius:16px;padding:20px;margin-bottom:16px}#service-platform-design .grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-bottom:18px}#service-platform-design .metric{background:var(--p-surface);border-radius:16px;padding:18px}#service-platform-design .metric strong{display:block;font-size:26px;font-weight:500;margin-top:6px}#service-platform-design .two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px}#service-platform-design .primary,#service-platform-design .secondary,#service-platform-design .danger{border:0;border-radius:10px;padding:11px 16px;display:inline-flex;gap:8px;align-items:center;justify-content:center;min-height:44px}#service-platform-design .primary{background:var(--p-action);color:var(--p-on)}#service-platform-design .secondary{background:var(--p-soft);color:var(--p-action)}#service-platform-design .danger{background:var(--p-warning);color:var(--p-danger)}#service-platform-design .actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:16px}#service-platform-design .badge{display:inline-block;background:var(--p-soft);color:var(--p-action);padding:4px 9px;border-radius:8px;font-size:12px;white-space:nowrap}#service-platform-design .badge.warn{background:var(--p-warning);color:var(--p-warntext)}#service-platform-design .banner{background:var(--p-warning);color:var(--p-warntext);padding:14px 16px;border-radius:12px;margin-bottom:18px}#service-platform-design .hero{background:var(--p-action);color:var(--p-on);border-radius:18px;padding:24px;margin-bottom:20px}#service-platform-design .hero p{color:inherit;opacity:.9}#service-platform-design .hero .primary{background:var(--p-lime);color:#254a29}#service-platform-design table{width:100%;border-collapse:collapse;text-align:left}#service-platform-design th{font-weight:500;color:var(--p-muted);font-size:12px}#service-platform-design th,#service-platform-design td{padding:13px 8px;border-bottom:1px solid var(--p-line);overflow-wrap:anywhere}#service-platform-design .row-button{color:var(--p-action);background:none;border:0;padding:7px 0;text-align:left}#service-platform-design .filter{display:flex;flex-wrap:wrap;gap:12px;margin-bottom:18px}#service-platform-design .filter input{flex:1;min-width:120px}#service-platform-design .filter select{width:auto}#service-platform-design label{display:block;color:var(--p-muted);font-size:12px;margin-bottom:12px}#service-platform-design label input,#service-platform-design label select,#service-platform-design label textarea{display:block;margin-top:6px;font-size:16px}#service-platform-design textarea{min-height:90px}#service-platform-design dl{margin:0}#service-platform-design dl div{display:flex;justify-content:space-between;gap:16px;padding:10px 0;border-bottom:1px solid var(--p-line)}#service-platform-design dt{color:var(--p-muted)}#service-platform-design dd{margin:0;text-align:right}#service-platform-design .timeline{display:grid;gap:18px}#service-platform-design .timeline div{padding-left:14px;border-left:2px solid var(--p-line)}#service-platform-design .timeline span{display:block;font-size:12px;color:var(--p-muted)}#service-platform-design .notice{margin:0 26px 20px;padding:14px;background:var(--p-soft);color:var(--p-action);border-radius:12px}#service-platform-design .phone{max-width:390px;margin:auto;background:var(--p-surface);border-radius:22px;padding:22px}#service-platform-design .phone h1{font-size:22px}#service-platform-design .phone .primary{width:100%}#service-platform-design .meter{height:8px;border-radius:8px;background:var(--p-line);overflow:hidden;margin:8px 0 14px}#service-platform-design .meter span{display:block;height:100%;background:var(--p-action)}#service-platform-design .center{max-width:440px;margin:24px auto}#service-platform-design .empty{text-align:center;padding:35px 10px}#service-platform-design .empty i{display:block;margin:0 auto 16px;width:32px;height:32px}
@media(max-width:700px){#service-platform-design .platform-shell{grid-template-columns:1fr}#service-platform-design .sidebar{padding:14px;border-right:0;gap:12px}#service-platform-design .sidebar nav{grid-template-columns:repeat(3,minmax(0,1fr))}#service-platform-design .nav-item{padding:9px 5px;font-size:12px;justify-content:center}#service-platform-design .nav-item i{display:none}#service-platform-design .staff{display:none}#service-platform-design header{padding:14px 16px}#service-platform-design .secure{display:none}#service-platform-design main{padding:18px 14px}#service-platform-design .grid{grid-template-columns:1fr}#service-platform-design .two{grid-template-columns:1fr}#service-platform-design .title-row{flex-wrap:wrap}#service-platform-design table,#service-platform-design tbody,#service-platform-design tr,#service-platform-design td{display:block}#service-platform-design thead{display:none}#service-platform-design tr{padding:10px 0;border-bottom:1px solid var(--p-line)}#service-platform-design td{border:0;padding:5px 0}#service-platform-design td:before{content:attr(data-label);display:inline-block;min-width:70px;font-size:12px;color:var(--p-muted);margin-right:8px}#service-platform-design .panel{padding:16px}#service-platform-design .notice{margin:0 14px 16px}}
</style>
<script>
(()=>{
const root=document.getElementById('service-platform-design');const main=root.querySelector('[data-main]');
const saved=window.openai?.widgetState;const snap=saved?.privateContent||saved||{};
let screen=typeof snap.screen==='string'?snap.screen:'dashboard';let suspended=false,paid=false,refundPending=false,ticketClosed=false;const activity=[];
const nav=[['dashboard','ภาพรวม','layout-dashboard'],['shops','ร้านทั้งหมด','store'],['plans','แพ็กเกจ','layers'],['payments','การชำระเงิน','credit-card'],['support','งานช่วยเหลือ','life-buoy'],['system','สถานะระบบ','activity'],['staff','ทีมผู้ดูแล','users'],['audit','ประวัติการจัดการ','history'],['settings','ตั้งค่า','settings']];
const go=(s,t)=>`<button type="button" class="secondary cursor-interaction" data-go="${s}">${t}</button>`;const primary=(s,t)=>`<button type="button" class="primary cursor-interaction" data-go="${s}">${t}</button>`;const badge=(t,w=false)=>`<span class="badge ${w?'warn':''}">${t}</span>`;
function table(headers,rows){return `<table><thead><tr>${headers.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map((c,i)=>`<td data-label="${headers[i]}">${c}</td>`).join('')}</tr>`).join('')}</tbody></table>`;}
const title=(t,sub='')=>`<div class="title-row"><div><h1>${t}</h1><p>${sub}</p></div></div>`;const panel=(t,c)=>`<section class="panel"><h2>${t}</h2>${c}</section>`;const row=(a,b)=>`<div><dt>${a}</dt><dd>${b}</dd></div>`;
function render(){
 const owner=screen.startsWith('owner-');root.dataset.owner=String(owner);root.querySelector('.sidebar').hidden=owner||['admin-login','admin-mfa'].includes(screen);root.querySelector('.platform-shell').style.gridTemplateColumns=owner||screen.startsWith('admin-')?'1fr':'';
 root.querySelector('nav').innerHTML=nav.map(([s,n,i])=>`<button class="nav-item cursor-interaction ${screen===s?'active':''}" data-go="${s}" type="button"><i data-lucide="${i}" aria-hidden="true"></i>${n}</button>`).join('');
 root.querySelector('[data-breadcrumb]').textContent=owner?'เจ้าของร้าน • สมาชิกและการชำระเงิน':screen.startsWith('admin-')?'เข้าสู่ระบบผู้ดูแล':nav.find(x=>x[0]===screen)?.[1]||'จัดการร้าน / รายละเอียด';
 root.querySelector('.notice').hidden=true;let html='';
 switch(screen){
 case 'dashboard':html=title('ดูแลร้านและการให้บริการ','วันที่ 2 ตุลาคม 2569 • คิวงานที่ต้องจัดการวันนี้')+`<div class="grid"><div class="metric">ร้านที่ใช้งาน<strong>8 ร้าน</strong></div><div class="metric">รอตรวจการชำระเงิน<strong>${paid?0:1} รายการ</strong></div><div class="metric">งานช่วยเหลือที่เปิด<strong>${ticketClosed?1:2} เรื่อง</strong></div></div>`+panel('รายการที่ต้องดูแล',table(['รายการ','ร้าน','ดำเนินการ'],[['ตรวจหลักฐานต่ออายุ','ABC Air',go('payment-detail','ตรวจรายการ')],['ใช้งานเกินจำนวนช่าง','น้ำใสเซอร์วิส',go('shop-usage','ดูการใช้งาน')],['ส่งรูปบริการไม่สำเร็จ','ABC Air',go('ticket','เปิดเรื่อง')]]))+panel('สถานะบริการ',`<dl>${row('API',badge('ปกติ'))}${row('คิวแจ้งเตือน',badge('ปกติ'))}${row('Backup ล่าสุด','02:00 • ทดสอบกู้คืน 25 ก.ย.')}</dl><div class="actions">${go('system','ดูระบบทั้งหมด')}</div>`);break;
 case 'shops':html=title('ร้านทั้งหมด','ค้นจากชื่อร้าน รหัสร้าน หรือเบอร์เจ้าของร้าน')+`<div class="filter"><input data-search aria-label="ค้นหาร้าน" placeholder="ค้นหาร้าน"><select data-shop-filter aria-label="สถานะร้าน"><option value="all">ทุกสถานะ</option><option value="active">ใช้งานอยู่</option><option value="expired">หมดอายุ</option></select></div><div class="panel" data-shop-list></div>`;break;
 case 'shop-detail':html=title('ABC Air', 'ร้าน R001 • เจ้าของร้าน คุณต้น')+`<div class="banner">${suspended?'ร้านถูกระงับด้วยเหตุด้านความปลอดภัย':'สมาชิกใกล้ถึงรอบต่ออายุ • การใช้งานยังเปิดตามรอบที่ชำระแล้ว'}</div><div class="two">`+panel('ร้านและสมาชิก',`<dl>${row('การเข้าถึง',badge(suspended?'ถูกระงับ':'ใช้งานได้',suspended))}${row('แพ็กเกจ','ทีมช่าง • รายเดือน')}${row('สิ้นสุดรอบ','10 ตุลาคม 2569')}${row('จำนวนช่าง','3 / 5 คน')}</dl><div class="actions">${go('shop-members','ดูสมาชิก')}${go('shop-usage','การใช้งาน')}</div>`)+panel('การจัดการร้าน',`<p>ทุกการเปลี่ยนสิทธิ์ต้องมีเหตุผลและบันทึกย้อนหลัง</p><div class="actions">${go('subscription-edit','แก้สิทธิ์สมาชิก')}${go('suspend','ระงับ / คืนสิทธิ์')}${go('support-access','ขอเข้าถึงเพื่อช่วยเหลือ')}${go('privacy','ข้อมูลและการส่งออก')}</div>`)+`</div>`+panel('เหตุการณ์ล่าสุด',`<div class="timeline"><div>ส่งหลักฐานต่ออายุ<span>วันนี้ 09:20 • เจ้าของร้าน</span></div><div>อนุมัติช่างคนที่ 3<span>28 ก.ย. • เจ้าของร้าน</span></div><div>เริ่มใช้งานแพ็กเกจทีมช่าง<span>10 ก.ย. • ชำระเงินยืนยันแล้ว</span></div></div>`);break;
 case 'shop-members':html=title('สมาชิกของ ABC Air','ดูข้อมูลสิทธิ์โดยไม่เปลี่ยนประวัติผู้ทำบริการ')+panel('ทีมงาน',table(['ชื่อ','บทบาท','สถานะ'],[['คุณต้น','Owner',badge('Active')],['ช่างเอก','Technician',badge('Active')],['ช่างบอล','Technician',badge('Active')],['ช่างนัท','Technician',badge('Pending',true)]]))+`<div class="actions">${go('shop-detail','กลับรายละเอียดร้าน')}</div>`;break;
 case 'shop-usage':html=title('การใช้งานและข้อจำกัด','ABC Air • อัปเดตจาก server')+panel('แพ็กเกจทีมช่าง',`<dl>${row('ช่าง Active','3 / 5 คน')}${row('พื้นที่ไฟล์','2.4 / 10 GB')}${row('OCR รอบนี้','42 / 200 ครั้ง')}${row('งานและประวัติ','ไม่จำกัดในแพ็กเกจตัวอย่าง')}</dl><div class="actions">${go('subscription-edit','จัดการสิทธิ์')}</div>`);break;
 case 'plans':html=title('แพ็กเกจและราคา','เวอร์ชันที่เผยแพร่แล้วไม่เปลี่ยนราคาให้ร้านเดิมย้อนหลัง')+panel('รายการแพ็กเกจ',table(['แพ็กเกจ','สิทธิ์ช่าง','สถานะ','จัดการ'],[['เริ่มต้น','2 คน',badge('เผยแพร่'),go('plan-edit','ดูเวอร์ชัน')],['ทีมช่าง','5 คน',badge('เผยแพร่'),go('plan-edit','สร้างเวอร์ชันใหม่')],['ธุรกิจ','ตามข้อตกลง',badge('ร่าง',true),go('plan-edit','แก้ไขร่าง')]]));break;
 case 'plan-edit':html=title('เวอร์ชันใหม่ของแพ็กเกจทีมช่าง','ตัวเลขเป็นข้อมูลทดลอง ยังไม่ใช่ราคาจำหน่าย')+panel('ราคาและสิทธิ์',`<label>ชื่อแพ็กเกจ<input value="ทีมช่าง"></label><div class="two"><label>ราคาต่อเดือน ตัวอย่าง<input type="number" value="590" min="0"></label><label>ช่าง Active สูงสุด<input type="number" value="5" min="1"></label></div><label>มีผลกับ<select><option>การสมัครใหม่และการต่ออายุที่ยืนยันราคาแล้ว</option></select></label><div class="actions">${go('plan-review','ตรวจสอบก่อนเผยแพร่')}${go('plans','กลับ')}</div>`);break;
 case 'plan-review':html=title('ตรวจสอบแพ็กเกจก่อนเผยแพร่')+panel('ทีมช่าง เวอร์ชันใหม่',`<dl>${row('รายเดือน ตัวอย่าง','590 บาท')}${row('ช่างสูงสุด','5 คน')}${row('ร้านที่มีรอบชำระอยู่','คงสิทธิ์และราคาในรอบเดิม')}</dl><label>เหตุผลที่เปลี่ยน<textarea data-reason placeholder="ระบุเหตุผลก่อนเผยแพร่"></textarea></label><button class="primary cursor-interaction" data-action="publish">เผยแพร่เวอร์ชันจำลอง</button>`);break;

 case 'owner-cancel':html=`<div class="phone">`+title('หยุดต่ออายุสมาชิก')+`<p>ร้านยังใช้งานได้จนถึง 10 ตุลาคม 2569 เมื่อสิ้นสุดรอบจะเข้าสู่โหมดอ่านข้อมูลเดิม</p><label>เหตุผล<select><option>ยังไม่ต้องการใช้งานต่อ</option><option>ขอให้ทีมติดต่อช่วยเหลือ</option></select></label><button class="danger cursor-interaction" data-action="cancel">ยืนยันหยุดต่ออายุจำลอง</button><div class="actions">${go('owner-sub','กลับ')}</div></div>`;break;
 default:screen='dashboard';return render();
 }
 main.innerHTML=html;if(screen==='shops')filterShops();globalThis.lucide?.createIcons({attrs:{width:18,height:18}});
}
function filterShops(){const q=(root.querySelector('[data-search]')?.value||'').toLowerCase(),f=root.querySelector('[data-shop-filter]')?.value||'all';const all=[['ABC Air','R001',suspended?'ถูกระงับ':'ใช้งานอยู่','active'],['น้ำใสเซอร์วิส','R002','ใช้งานอยู่','active'],['บ้านเย็น','R003','หมดอายุ','expired']].filter(r=>(r[0]+r[1]).toLowerCase().includes(q)&&(f==='all'||r[3]===f));root.querySelector('[data-shop-list]').innerHTML=table(['ร้าน','รหัส','สถานะ','รายละเอียด'],all.map(r=>[r[0],r[1],badge(r[2],r[3]==='expired'),go('shop-detail','เปิดร้าน')]))||'<p>ไม่พบร้าน</p>';}
function save(){window.openai?.setWidgetState?.({modelContent:{screen},privateContent:{screen}})?.catch(()=>{});}
function notify(t,error=false){const n=root.querySelector('.notice');n.textContent=t;n.hidden=false;n.setAttribute('role',error?'alert':'status');}
root.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.go){screen=b.dataset.go;render();save();return;}const a=b.dataset.action;if(!a)return;const reason=root.querySelector('[data-reason]')?.value.trim();if(!['cancel','reconcile'].includes(a)&&!reason){notify('กรุณาระบุเหตุผลก่อนดำเนินการ',true);return;}if(a==='approve-payment'&&!root.querySelector('[data-bank-ref]')?.value.trim()){notify('กรุณาระบุอ้างอิงรายการรับเงินจริง',true);return;}if(a==='suspend'&&root.querySelector('[data-confirm]')?.value!=='ABC Air'){notify('พิมพ์ชื่อร้าน ABC Air ให้ตรงก่อนยืนยัน',true);return;}if(a==='approve-payment')paid=true;if(a==='suspend')suspended=!suspended;if(a==='refund')refundPending=true;if(a==='close-ticket')ticketClosed=true;activity.unshift(({publish:'เผยแพร่เวอร์ชันแพ็กเกจ',suspend:'เปลี่ยนสถานะระงับร้าน',grant:'ให้สิทธิ์ชั่วคราว',refund:'ขอคืนเงิน รอผู้อนุมัติ',cancel:'หยุดต่ออายุเมื่อสิ้นสุดรอบ',access:'ขอเข้าถึงเพื่อช่วยเหลือ รออนุมัติ','approve-payment':'ยืนยันรายการรับเงินจำลอง','reject-payment':'ขอหลักฐานใหม่','close-ticket':'ปิดเรื่องช่วยเหลือ',privacy:'สร้างคำขอข้อมูล',settings:'ปรับนโยบายสมาชิก',staff:'ขอปรับสิทธิ์ผู้ดูแล',announcement:'บันทึกร่างประกาศ',incident:'สร้างเหตุขัดข้อง',reconcile:'ตรวจรับเงินและสิทธิ์ซ้ำ'})[a]||a);render();notify('บันทึกในต้นแบบแล้ว • ไม่มีการเปลี่ยนข้อมูลหรือรับเงินจริง');save();});
root.addEventListener('input',e=>{if(e.target.matches('[data-search]'))filterShops();});root.addEventListener('change',e=>{if(e.target.matches('[data-shop-filter]'))filterShops();if(e.target.matches('[data-preview]')){screen=e.target.value;render();save();}});
window.addEventListener('openai:set_globals',e=>{const s=e.detail?.globals?.widgetState;const v=s?.privateContent||s;if(v?.screen&&v.screen!==screen){screen=v.screen;render();}});render();
})();
</script>
