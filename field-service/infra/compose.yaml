services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: fs_owner
      POSTGRES_DB: field_service
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      MIGRATION_DB_PASSWORD: ${MIGRATION_DB_PASSWORD:?Set MIGRATION_DB_PASSWORD}
      API_DB_PASSWORD: ${API_DB_PASSWORD:?Set API_DB_PASSWORD}
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/00-roles.sql:/docker-entrypoint-initdb.d/00-roles.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U fs_owner -d field_service']
      interval: 5s
      timeout: 3s
      retries: 12
volumes:
  postgres_data:
